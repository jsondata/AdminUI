<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>AdminUI · 仅使用组件</title>
        <link rel="stylesheet" href="../../vendor/tabler/tabler.min.css" />
        <link rel="stylesheet" href="../../vendor/element-plus/index.css" />
        <link rel="stylesheet" href="../../src/admin-ui.css" />
    </head>
    <body>
        <div id="app" v-cloak style="max-width: 1000px; margin: 40px auto; padding: 20px">
            <a-page-header title="无需使用整个框架" category="独立组件" description="也能嵌入已有的 Go / PHP / Java 页面" />
            <a-panel title="独立组件示例">
                <a-form :model="form" :fields="fields" :rules="rules" @submit="save" @cancel="form.title=''" />
            </a-panel>
            <a-panel v-if="result" title="校验结果"><a-code :code="result" label="JSON" /></a-panel>
        </div>
        <script src="../../vendor/vue/vue.global.prod.js"></script>
        <script src="../../vendor/element-plus/index.full.min.js"></script>
        <script src="../../vendor/element-plus/zh-cn.min.js"></script>
        <script src="../../src/admin-ui.js"></script>
        <script>
            Vue.createApp({
                setup() {
                    const form = Vue.reactive({ title: '', type: 'article' }),
                        result = Vue.ref('');
                    return {
                        form,
                        result,
                        fields: [
                            { key: 'title', label: '标题' },
                            {
                                key: 'type',
                                label: '类型',
                                type: 'select',
                                options: [
                                    { label: '文章', value: 'article' },
                                    { label: '图集', value: 'gallery' },
                                ],
                            },
                        ],
                        rules: {
                            title: [{ required: true, message: '请填写标题', trigger: 'blur' }],
                        },
                        save() {
                            result.value = JSON.stringify(form, null, 2);
                        },
                    };
                },
            })
                .use(ElementPlus, { locale: ElementPlusLocaleZhCn })
                .use(AdminUI)
                .mount('#app');
        </script>
    </body>
</html>
