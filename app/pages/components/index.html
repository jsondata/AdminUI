<div>
    <a-page-header title="基础组件" category="组件" description="Tabler 的视觉秩序，Element Plus 的交互能力" />
    <a-panel title="主题色彩" description="通过 CSS 变量统一调整品牌与状态">
        <div class="demo-token-grid">
            <div v-for="c in colors" class="demo-token">
                <span :style="{background:c.value}"></span>
                <strong>{{c.name}}</strong>
                {{c.value}}
            </div>
        </div>
    </a-panel>
    <div class="demo-component-grid">
        <a-panel title="按钮与操作">
            <div class="demo-button-row">
                <el-button type="primary" @click="message('success')">
                    主要操作
                </el-button>
                <el-button @click="message('info')">默认按钮</el-button>
                <el-button type="success" plain @click="message('success')">
                    成功
                </el-button>
                <el-button type="danger" plain @click="message('error')">
                    危险操作
                </el-button>
            </div>
            <div class="demo-button-row">
                <el-button type="primary" loading>加载中</el-button>
                <el-button disabled>禁用状态</el-button>
                <el-button text type="primary" @click="message('info')">
                    文字按钮
                </el-button>
            </div>
            <small class="demo-doc-text" role="status">{{notice}}</small>
        </a-panel>
        <a-panel title="选择器">
            <div class="demo-button-row">
                <el-select v-model="selected" aria-label="主题色">
                    <el-option label="蓝色 · Blue" value="blue" />
                    <el-option label="青色 · Teal" value="teal" />
                    <el-option label="紫色 · Purple" value="purple" />
                </el-select>
                <el-select v-model="multi" multiple placeholder="选择组件" aria-label="选择组件">
                    <el-option label="表单组件" value="form" />
                    <el-option label="数据表格" value="table" />
                    <el-option label="布局框架" value="layout" />
                </el-select>
            </div>
            <p class="demo-doc-text mb-0">
                全部使用统一下拉面板，支持键盘选择、多选与禁用项。
            </p>
        </a-panel>
        <a-panel title="反馈与弹层">
            <div class="demo-button-row">
                <el-button @click="message('success')">成功提示</el-button>
                <el-button @click="message('warning')">提醒</el-button>
                <el-button @click="visible=true">打开对话框</el-button>
                <el-button @click="drawer=true">打开抽屉</el-button>
            </div>
            <el-alert title="这是一条示例通知，所有操作仅用于交互演示。" type="info" :closable="false" show-icon />
        </a-panel>
        <a-panel title="状态与切换">
            <div class="demo-button-row">
                <el-tag effect="light">进行中</el-tag>
                <el-tag type="success">已完成</el-tag>
                <el-tag type="warning">待审核</el-tag>
                <el-tag type="danger">已停用</el-tag>
            </div>
            <div class="demo-button-row">
                <el-switch v-model="check" aria-label="启用功能" />
                <el-radio-group v-model="radio">
                    <el-radio value="a">选项 A</el-radio>
                    <el-radio value="b">选项 B</el-radio>
                </el-radio-group>
            </div>
        </a-panel>
        <a-panel title="标签页">
            <el-tabs v-model="tab">
                <el-tab-pane label="基础设置" name="base">
                    <p class="demo-doc-text">将相关信息组织在一起，减少页面跳转。</p>
                </el-tab-pane>
                <el-tab-pane label="高级选项" name="advanced">
                    <p class="demo-doc-text">这里是高级选项的示例内容。</p>
                </el-tab-pane>
                <el-tab-pane label="变更记录" name="history">
                    <p class="demo-doc-text">v0.2.0 · 初始组件库。</p>
                </el-tab-pane>
            </el-tabs>
        </a-panel>
        <a-panel title="空状态">
            <a-empty title="这里还没有内容" description="清楚说明当前状态，并提供下一步操作。">
                <el-button type="primary" @click="message('info')">开始创建</el-button>
            </a-empty>
        </a-panel>
    </div>
    <el-dialog v-model="visible" title="一个清晰的对话框" width="min(460px,92vw)">
        <p class="demo-doc-text">
            用于需要聚焦处理的操作。表单和业务内容可以通过插槽放在这里。
        </p>
        <template #footer>
            <el-button @click="visible=false">取消</el-button>
            <el-button type="primary" @click="visible=false;message('success')">
                确认
            </el-button>
        </template>
    </el-dialog>
    <el-drawer v-model="drawer" title="侧边抽屉" size="min(420px,92vw)">
        <p class="demo-doc-text">保留主页面上下文，适合详情预览和较长的编辑表单。</p>
        <a-code code='<el-drawer v-model="visible" title="详情">…</el-drawer>' />
    </el-drawer>
</div>
